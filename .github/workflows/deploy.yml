# Publica o site no Azure Container Apps a cada push no main (ou pelo botão "Run workflow" na aba Actions)
name: Deploy

on:
  push:
    branches: [main]
    # Mudança só em texto de documentação ou nos prints do README não precisa de deploy.
    # "*.png" pega só a raiz (os prints); as imagens do site em wwwroot/ continuam disparando.
    paths-ignore:
      - "**.md"
      - "*.png"
  workflow_dispatch:

# Se dois pushes saírem em sequência, o segundo espera o primeiro terminar em vez de rodarem juntos
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read   # ler o código do repo
  packages: write  # mandar a imagem pro GHCR
  id-token: write  # pedir o token OIDC que o Azure aceita no lugar de senha

env:
  IMAGE: ghcr.io/afcventura/ghibli-fan-tribute
  RESOURCE_GROUP: rg-ghibli-tribute
  CONTAINER_APP: ghibli-tribute

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag com o hash do commit (cada deploy aponta pra uma imagem exata) e "latest" por conveniência.
      # O cache "gha" guarda as camadas entre execuções: se o .csproj não mudou, o restore não roda de novo.
      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Troca a imagem do app (gera uma revisão nova) e garante o ingress na 8080, a porta do .NET no container
      - name: Atualizar o Container App
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ github.sha }}"
          az containerapp ingress update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --target-port 8080
